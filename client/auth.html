<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Register — PrepDeck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
              }
            },
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen flex flex-col justify-between antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Header bar -->
    <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2.5 text-decoration-none">
            <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shadow-indigo-100">
                <i class="fa-solid fa-graduation-cap text-sm"></i>
            </div>
            <span class="font-bold text-lg text-slate-900 tracking-tight">PrepDeck</span>
        </a>
        <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-800 transition-colors flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left text-[10px]"></i> Back to Home
        </a>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 sm:py-12">
        <div class="w-full max-w-md">
            
            <!-- Auth Card -->
            <div class="saas-card bg-white p-6 sm:p-8 rounded-2xl border border-slate-200/90 shadow-xl shadow-slate-200/50">
                
                <!-- Tab Switcher -->
                <div class="flex bg-slate-100/90 p-1 rounded-xl mb-6 border border-slate-200/60">
                    <button type="button" id="tab-login" onclick="switchMode('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-900 bg-white shadow-sm">
                        Sign In
                    </button>
                    <button type="button" id="tab-signup" onclick="switchMode('signup')" class="flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900">
                        Create Account
                    </button>
                </div>

                <!-- Header Title -->
                <div class="mb-6 text-center">
                    <h1 id="auth-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">Welcome back</h1>
                    <p id="auth-subtitle" class="text-xs text-slate-500 mt-1">Sign in with your university credentials</p>
                </div>

                <!-- Alert Message -->
                <div id="auth-alert" class="hidden mb-5 p-3 rounded-xl text-xs font-semibold border flex items-center gap-2.5">
                    <i id="auth-alert-icon" class="fa-solid fa-circle-exclamation shrink-0"></i>
                    <span id="auth-alert-text" class="flex-1"></span>
                </div>

                <!-- Form -->
                <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    
                    <!-- Full Name (Signup only) -->
                    <div id="name-field-group" class="hidden">
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Full Name</label>
                        <div class="relative">
                            <i class="fa-regular fa-user absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="text" id="name-input" placeholder="e.g. Samiksha Atirkar" class="w-full bg-white border border-slate-200 rounded-xl py-2.5 pl-9 pr-3.5 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all">
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 mb-1.5">Email Address</label>
                        <div class="relative">
                            <i class="fa-regular fa-envelope absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="email" id="email-input" required placeholder="scholar@university.ac.in" class="w-full bg-white border border-slate-200 rounded-xl py-2.5 pl-9 pr-3.5 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="text-xs font-semibold text-slate-700">Password</label>
                            <span id="forgot-link" class="text-[11px] font-semibold text-indigo-600 hover:text-indigo-800 cursor-pointer" onclick="handleForgotHint()">Forgot?</span>
                        </div>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                            <input type="password" id="password-input" required placeholder="••••••••" class="w-full bg-white border border-slate-200 rounded-xl py-2.5 pl-9 pr-10 text-sm font-medium text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 transition-all">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 focus:outline-none p-0.5">
                                <i id="eye-icon" class="fa-regular fa-eye text-xs"></i>
                            </button>
                        </div>
                        <p id="password-hint" class="hidden text-[11px] text-slate-400 mt-1">Must be at least 6 characters.</p>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-2">
                        <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-sm shadow-indigo-200 transition-all flex items-center justify-center gap-2 cursor-pointer">
                            <span id="submit-btn-text">Sign In</span>
                        </button>
                    </div>
                </form>

                <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                    <p class="text-xs text-slate-500" id="auth-switch-prompt">
                        Don't have an account? 
                        <button type="button" onclick="switchMode('signup')" class="font-bold text-indigo-600 hover:underline ml-1">Create one</button>
                    </p>
                </div>
            </div>

            <!-- Security Badge -->
            <div class="mt-6 text-center text-xs text-slate-400 flex items-center justify-center gap-2">
                <i class="fa-solid fa-shield-check text-emerald-500"></i>
                <span>Private user data isolation • JWT 256-bit encryption</span>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-200/60 bg-white/50">
        © 2026 PrepDeck. All scholar data is private and securely encrypted.
    </footer>

    <script src="js/api.js"></script>
    <script>
        // If already logged in, redirect straight to dashboard
        if (api.isAuthenticated()) {
            window.location.replace('dashboard.html');
        }

        let currentMode = 'login';

        function switchMode(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const nameGroup = document.getElementById('name-field-group');
            const nameInput = document.getElementById('name-input');
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const submitBtnText = document.getElementById('submit-btn-text');
            const switchPrompt = document.getElementById('auth-switch-prompt');
            const forgotLink = document.getElementById('forgot-link');
            const passwordHint = document.getElementById('password-hint');
            const alertBox = document.getElementById('auth-alert');

            alertBox.classList.add('hidden');

            if (mode === 'signup') {
                tabSignup.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-900 bg-white shadow-sm';
                tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900';
                nameGroup.classList.remove('hidden');
                nameInput.required = true;
                title.innerText = 'Create your account';
                subtitle.innerText = 'Start tracking focus and studying smarter';
                submitBtnText.innerText = 'Create Scholar Account';
                switchPrompt.innerHTML = 'Already have an account? <button type="button" onclick="switchMode(\'login\')" class="font-bold text-indigo-600 hover:underline ml-1">Sign In</button>';
                forgotLink.classList.add('hidden');
                passwordHint.classList.remove('hidden');
            } else {
                tabLogin.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-900 bg-white shadow-sm';
                tabSignup.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-900';
                nameGroup.classList.add('hidden');
                nameInput.required = false;
                nameInput.value = '';
                title.innerText = 'Welcome back';
                subtitle.innerText = 'Sign in with your university credentials';
                submitBtnText.innerText = 'Sign In';
                switchPrompt.innerHTML = 'Don\'t have an account? <button type="button" onclick="switchMode(\'signup\')" class="font-bold text-indigo-600 hover:underline ml-1">Create one</button>';
                forgotLink.classList.remove('hidden');
                passwordHint.classList.add('hidden');
            }
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password-input');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.className = 'fa-regular fa-eye-slash text-xs text-indigo-600';
            } else {
                pwdInput.type = 'password';
                eyeIcon.className = 'fa-regular fa-eye text-xs text-slate-400';
            }
        }

        function handleForgotHint() {
            showAlert('If you forgot your password, please contact your administrator or register a new scholar account.', 'info');
        }

        function showAlert(msg, type = 'error') {
            const alertBox = document.getElementById('auth-alert');
            const alertText = document.getElementById('auth-alert-text');
            const alertIcon = document.getElementById('auth-alert-icon');
            alertText.innerText = msg;
            alertBox.classList.remove('hidden', 'bg-rose-50', 'border-rose-200', 'text-rose-900', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-900', 'bg-indigo-50', 'border-indigo-200', 'text-indigo-900');

            if (type === 'error') {
                alertBox.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-900');
                alertIcon.className = 'fa-solid fa-circle-exclamation shrink-0 text-rose-500';
            } else if (type === 'success') {
                alertBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-900');
                alertIcon.className = 'fa-solid fa-circle-check shrink-0 text-emerald-500';
            } else {
                alertBox.classList.add('bg-indigo-50', 'border-indigo-200', 'text-indigo-900');
                alertIcon.className = 'fa-solid fa-circle-info shrink-0 text-indigo-500';
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;
            const submitBtn = document.getElementById('submit-btn');
            const submitBtnText = document.getElementById('submit-btn-text');

            if (!email || !password) {
                showAlert('Please provide both email and password.');
                return;
            }

            submitBtn.disabled = true;
            submitBtnText.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Authenticating...';

            try {
                if (currentMode === 'signup') {
                    const name = document.getElementById('name-input').value.trim();
                    if (!name) {
                        throw new Error('Please enter your full name.');
                    }
                    await api.register(name, email, password);
                    showAlert('Account created! Redirecting to dashboard...', 'success');
                } else {
                    await api.login(email, password);
                    showAlert('Signed in successfully! Redirecting...', 'success');
                }

                setTimeout(() => {
                    window.location.replace('dashboard.html');
                }, 400);
            } catch (err) {
                showAlert(err.message || 'Authentication failed. Please verify credentials.');
                submitBtn.disabled = false;
                submitBtnText.innerText = currentMode === 'signup' ? 'Create Scholar Account' : 'Sign In';
            }
        }

        // Initialize mode from URL params e.g. ?mode=signup
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'signup') {
            switchMode('signup');
        } else {
            switchMode('login');
        }
    </script>
</body>
</html>
